name: brand

# Runs on every push and pull request, docs included: Markdown colours are checked too.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: brand-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache: false
      - name: colours match brand/tokens.json
        run: go run ./scripts/brandcheck
